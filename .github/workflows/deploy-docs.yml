# Pushes the Docusaurus build to the `gh-pages` branch.
# In the repo: Settings → Pages → Build and deployment → Source: "Deploy from a branch"
# Branch: gh-pages, folder: / (root).
# Do not use "GitHub Actions" as the Pages source for this workflow—the branch deploy is the supported path here.

name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'ops/**'
      - '.github/workflows/deploy-docs.yml'

permissions:
  contents: write

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install and build
        working-directory: website
        env:
          DOCUSAURUS_URL: https://${{ github.repository_owner }}.github.io
          DOCUSAURUS_BASE_URL: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build
          test -d build/assets/css
          test -d build/assets/js

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/build
          force_orphan: true
